name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: npm run version:check

      - name: Run quality gates
        run: npm run quality

      - name: Package HACS release
        run: |
          mkdir -p release/assist-pipeline-card
          cp dist/hacs-assist-pipeline-card.js release/assist-pipeline-card/
          cp dist/hacs-assist-pipeline-card.js.map release/assist-pipeline-card/
          cp hacs.json README.md LICENSE release/assist-pipeline-card/
          cd release
          zip -r assist-pipeline-card-${GITHUB_REF_NAME}.zip assist-pipeline-card

      - name: Generate release notes
        run: |
          {
            echo "## Assist Pipeline Card ${GITHUB_REF_NAME}"
            echo
            echo "HACS release artifact: \`assist-pipeline-card-${GITHUB_REF_NAME}.zip\`"
            echo
            echo "Built from commit \`${GITHUB_SHA}\`."
          } > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release/assist-pipeline-card-${GITHUB_REF_NAME}.zip" \
            "dist/hacs-assist-pipeline-card.js" \
            "dist/hacs-assist-pipeline-card.js.map" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
